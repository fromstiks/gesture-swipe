name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # позволяет запускать сборку вручную кнопкой в GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Модель MediaPipe большая и не хранится в репозитории — качаем на лету.
      - name: Download MediaPipe hand model
        run: |
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/hand_landmarker.task \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task"
          ls -lh app/src/main/assets/hand_landmarker.task

      # Постоянный ключ подписи хранится в секрете (base64), не в репозитории.
      # Без него сборка тоже пройдёт, но подпись будет одноразовая.
      - name: Restore signing keystore
        env:
          STABLE_KEYSTORE_B64: ${{ secrets.STABLE_KEYSTORE_B64 }}
        run: |
          if [ -n "$STABLE_KEYSTORE_B64" ]; then
            echo "$STABLE_KEYSTORE_B64" | base64 -d > app/stable.keystore
            echo "Signing keystore restored from secret."
          else
            echo "No STABLE_KEYSTORE_B64 secret set — falling back to default debug signing."
          fi

      # В репозитории нет gradle-wrapper.jar (это бинарник) — генерируем на раннере.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gesture-swipe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
