name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # позволяет запускать сборку вручную кнопкой в GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Модель MediaPipe большая и не хранится в репозитории — качаем на лету.
      - name: Download MediaPipe hand model
        run: |
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/hand_landmarker.task \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task"
          ls -lh app/src/main/assets/hand_landmarker.task

      # Постоянный ключ подписи хранится в секрете (base64), не в репозитории.
      # Без него сборка тоже пройдёт, но подпись будет одноразовая.
      - name: Restore signing keystore
        env:
          STABLE_KEYSTORE_B64: ${{ secrets.STABLE_KEYSTORE_B64 }}
        run: |
          if [ -n "$STABLE_KEYSTORE_B64" ]; then
            echo "$STABLE_KEYSTORE_B64" | base64 -d > app/stable.keystore
            echo "Signing keystore restored from secret."
          else
            echo "No STABLE_KEYSTORE_B64 secret set — falling back to default debug signing."
          fi

      # В репозитории нет gradle-wrapper.jar (это бинарник) — генерируем на раннере.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gesture-swipe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Optional: auto-deliver the APK to Telegram if bot secrets are configured.
      - name: Send APK to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            SIZE=$(stat -c%s "$APK")
            echo "APK size: $((SIZE/1024/1024)) MB"
            curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendDocument" \
              -F chat_id="$TG_CHAT" \
              -F document=@"$APK" \
              -F caption="GestureSwipe: свежая сборка ✅" \
              && echo "Sent to Telegram." || echo "Telegram send failed (file may exceed 50 MB)."
          else
            echo "Telegram secrets not set; skipping delivery."
          fi
