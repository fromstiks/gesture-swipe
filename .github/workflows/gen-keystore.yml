name: Generate signing keystore

# Одноразовый ручной workflow: генерирует постоянный ключ подписи и выкладывает
# его артефактом, чтобы положить в репозиторий. Запускается только вручную.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore stable.keystore \
            -storepass gesturepass \
            -keypass gesturepass \
            -alias gestureswipe \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=GestureSwipe, OU=Dev, O=GestureSwipe, L=NA, ST=NA, C=NA"
          ls -l stable.keystore

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: stable-keystore
          path: stable.keystore
